<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(230 88) rotate(35) scale(420 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity=".40"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(980 260) rotate(-20) scale(430 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity=".32"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="330" y1="0" x2="870" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
