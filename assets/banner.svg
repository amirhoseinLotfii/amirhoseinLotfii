    <path d="M84 298H260" stroke="#334155" stroke-width="2"/>
    <path d="M940 64H1116" stroke="#334155" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="104" y="68" width="992" height="224" rx="28" fill="#0F172A" fill-opacity=".72" stroke="#334155"/>
  </g>

  <g transform="translate(150 112)">
